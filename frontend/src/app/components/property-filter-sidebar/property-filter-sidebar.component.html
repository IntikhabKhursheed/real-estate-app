<aside class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-gray-900">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-lg font-bold text-gray-950 dark:text-white">Filters</h2>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Refine the listing set and keep the URL shareable.</p>
    </div>
    <button type="button" (click)="onReset()" class="text-sm font-semibold text-blue-600 hover:text-blue-700 dark:text-blue-400">
      Reset
    </button>
  </div>

  <form [formGroup]="form" class="mt-5 space-y-5">
    <label class="block">
      <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">City</span>
      <select formControlName="city" class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-gray-950 dark:border-gray-700 dark:bg-gray-950 dark:text-white">
        <option value="">All cities</option>
        <option *ngFor="let city of cityList" [value]="city">{{ city }}</option>
      </select>
    </label>

    <label class="block">
      <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Property Type</span>
      <select formControlName="propertyType" class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-gray-950 dark:border-gray-700 dark:bg-gray-950 dark:text-white">
        <option value="">Any type</option>
        <option *ngFor="let type of propertyTypes" [value]="type">{{ type }}</option>
      </select>
    </label>

    <label class="block">
      <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Purpose</span>
      <select formControlName="purpose" class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-gray-950 dark:border-gray-700 dark:bg-gray-950 dark:text-white">
        <option value="">Any purpose</option>
        <option *ngFor="let purpose of purposes" [value]="purpose">{{ purpose }}</option>
      </select>
    </label>

    <label class="block">
      <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Bedrooms</span>
      <select formControlName="bedrooms" class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-gray-950 dark:border-gray-700 dark:bg-gray-950 dark:text-white">
        <option *ngFor="let option of bedroomOptions" [value]="option.value">{{ option.label }}</option>
      </select>
    </label>

    <div>
      <div class="flex items-center justify-between">
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Price Range</span>
        <span class="text-xs text-gray-500 dark:text-gray-400">PKR</span>
      </div>
      <div class="mt-3 space-y-3">
        <input formControlName="minPrice" type="range" min="0" max="500000000" step="500000" class="w-full accent-blue-600">
        <input formControlName="maxPrice" type="range" min="0" max="500000000" step="500000" class="w-full accent-blue-600">
        <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
          <span>{{ minPriceLabel }}</span>
          <span>{{ maxPriceLabel }}</span>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <label class="block">
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Min Marla</span>
        <input type="number" formControlName="minAreaMarla" class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-gray-950 dark:border-gray-700 dark:bg-gray-950 dark:text-white">
      </label>
      <label class="block">
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Max Marla</span>
        <input type="number" formControlName="maxAreaMarla" class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-gray-950 dark:border-gray-700 dark:bg-gray-950 dark:text-white">
      </label>
    </div>

    <label class="block">
      <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Sort By</span>
      <select formControlName="sortBy" class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-gray-950 dark:border-gray-700 dark:bg-gray-950 dark:text-white">
        <option *ngFor="let option of sortOptions" [value]="option.value">{{ option.label }}</option>
      </select>
    </label>

    <button type="button" (click)="onApply()" class="w-full rounded-lg bg-blue-600 px-4 py-3 font-bold text-white transition hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600">
      Apply Filters
    </button>
  </form>
</aside>
