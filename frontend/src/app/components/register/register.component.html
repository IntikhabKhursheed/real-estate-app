<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800 flex items-center justify-center py-8 transition-colors duration-300">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">EstateIQ</h1>
        <p class="text-gray-600 dark:text-gray-400">Create your account</p>
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Full Name Field -->
        <div>
          <label class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">Full Name</label>
          <input 
            type="text" 
            formControlName="fullName" 
            placeholder="John Doe"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-600 transition"
          >
          <span *ngIf="form.get('fullName')?.invalid && form.get('fullName')?.touched" class="text-red-600 dark:text-red-400 text-sm">
            <span *ngIf="form.get('fullName')?.errors?.['required']">Name is required</span>
            <span *ngIf="form.get('fullName')?.errors?.['minlength']">Name must be at least 2 characters</span>
          </span>
        </div>

        <!-- Email Field -->
        <div>
          <label class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">Email Address</label>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="you@example.com"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-600 transition"
          >
          <span *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-red-600 dark:text-red-400 text-sm">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Please enter a valid email</span>
          </span>
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">Password</label>
          <div class="relative">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              formControlName="password" 
              placeholder="••••••••"
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-600 transition"
            >
            <button 
              type="button" 
              (click)="togglePasswordVisibility()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-300"
            >
              <span *ngIf="!showPassword">👁️</span>
              <span *ngIf="showPassword">👁️‍🗨️</span>
            </button>
          </div>
          <span *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-red-600 dark:text-red-400 text-sm">
            <span *ngIf="form.get('password')?.errors?.['required']">Password is required</span>
            <span *ngIf="form.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
          </span>
        </div>

        <!-- Confirm Password Field -->
        <div>
          <label class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">Confirm Password</label>
          <div class="relative">
            <input 
              [type]="showConfirmPassword ? 'text' : 'password'" 
              formControlName="confirmPassword" 
              placeholder="••••••••"
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-600 transition"
            >
            <button 
              type="button" 
              (click)="toggleConfirmPasswordVisibility()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-300"
            >
              <span *ngIf="!showConfirmPassword">👁️</span>
              <span *ngIf="showConfirmPassword">👁️‍🗨️</span>
            </button>
          </div>
          <span *ngIf="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched" class="text-red-600 dark:text-red-400 text-sm">
            <span *ngIf="form.get('confirmPassword')?.errors?.['required']">Please confirm your password</span>
          </span>
          <span *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched" class="text-red-600 dark:text-red-400 text-sm">
            Passwords do not match
          </span>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="bg-red-100 dark:bg-red-900 border border-red-400 dark:border-red-700 text-red-700 dark:text-red-200 px-4 py-3 rounded">
          {{ error }}
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          [disabled]="isLoading || form.invalid"
          class="w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-lg transition mt-6"
        >
          <span *ngIf="!isLoading">Create Account</span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <span class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>
            Creating account...
          </span>
        </button>
      </form>

      <!-- Divider -->
      <div class="my-6 flex items-center">
        <div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
        <span class="px-4 text-gray-600 dark:text-gray-400">or</span>
        <div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
      </div>

      <!-- Login Link -->
      <p class="text-center text-gray-600 dark:text-gray-400">
        Already have an account?
        <button 
          (click)="goToLogin()" 
          class="text-blue-600 dark:text-blue-400 hover:underline font-semibold"
        >
          Login here
        </button>
      </p>

      <!-- Back to Home -->
      <p class="text-center mt-4">
        <a routerLink="/" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-300 transition">
          ← Back to Home
        </a>
      </p>
    </div>
  </div>
</div>
