<div class="fixed bottom-4 right-4 z-[70] flex w-full max-w-sm flex-col gap-3 px-4 sm:px-0">
  <div *ngFor="let toast of (toasts$ | async)" class="animate-toast-enter overflow-hidden rounded-2xl border shadow-2xl backdrop-blur">
    <div class="flex items-start gap-3 px-4 py-3" [ngClass]="toastClass(toast.type)">
      <div class="mt-0.5 h-2.5 w-2.5 rounded-full bg-current"></div>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold">{{ toast.message }}</p>
      </div>
      <button (click)="dismiss(toast.id)" class="ml-2 text-current/70 transition hover:text-current" aria-label="Dismiss toast">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
