<section class="min-h-screen bg-gray-50 py-6 transition-colors duration-300 dark:bg-gray-950">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <a routerLink="/properties"
       class="mb-5 inline-flex items-center gap-2 rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm transition hover:border-blue-300 hover:text-blue-700 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-200 dark:hover:border-blue-700 dark:hover:text-blue-300">
      <span aria-hidden="true">&larr;</span>
      Back to listings
    </a>

    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-950 dark:text-white md:text-4xl">Add New Property</h1>
      <p class="mt-2 text-gray-600 dark:text-gray-300">Create the listing first, then EstateIQ uploads the selected images to Cloudinary.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
      <main class="space-y-6">
        <section class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
          <h2 class="text-xl font-bold text-gray-950 dark:text-white">Listing Details</h2>

          <div class="mt-5 grid gap-4 md:grid-cols-2">
            <label class="md:col-span-2">
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Title</span>
              <input type="text" formControlName="title"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500"
                     placeholder="Modern house in DHA Lahore">
              <span *ngIf="isInvalid('title')" class="mt-1 block text-sm text-red-600 dark:text-red-400">Title is required.</span>
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Price (PKR)</span>
              <input type="number" formControlName="price"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500"
                     placeholder="25000000">
              <span *ngIf="isInvalid('price')" class="mt-1 block text-sm text-red-600 dark:text-red-400">Enter a valid price.</span>
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Purpose</span>
              <select formControlName="purpose"
                      class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500">
                <option *ngFor="let purpose of purposes" [value]="purpose">{{ purpose }}</option>
              </select>
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Property Type</span>
              <select formControlName="propertyType"
                      class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500">
                <option value="">Select type</option>
                <option *ngFor="let type of propertyTypes" [value]="type">{{ type }}</option>
              </select>
              <span *ngIf="isInvalid('propertyType')" class="mt-1 block text-sm text-red-600 dark:text-red-400">Property type is required.</span>
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">City</span>
              <input type="text" formControlName="city"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500"
                     placeholder="Lahore">
              <span *ngIf="isInvalid('city')" class="mt-1 block text-sm text-red-600 dark:text-red-400">City is required.</span>
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Area / Society</span>
              <input type="text" formControlName="areaName"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500"
                     placeholder="DHA Phase 6">
            </label>

            <label class="md:col-span-2">
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Address</span>
              <input type="text" formControlName="address"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500"
                     placeholder="Street, block, nearby landmark">
            </label>

            <label class="md:col-span-2">
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Description</span>
              <textarea formControlName="description" rows="6"
                        class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500"
                        placeholder="Describe the property, neighborhood, access roads, and condition."></textarea>
              <span *ngIf="isInvalid('description')" class="mt-1 block text-sm text-red-600 dark:text-red-400">Description must be at least 20 characters.</span>
            </label>
          </div>
        </section>

        <section class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
          <h2 class="text-xl font-bold text-gray-950 dark:text-white">Size and Rooms</h2>

          <div class="mt-5 grid gap-4 md:grid-cols-2 lg:grid-cols-3">
            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Bedrooms</span>
              <input type="number" formControlName="bedrooms"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500">
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Bathrooms</span>
              <input type="number" formControlName="bathrooms"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500">
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Age (years)</span>
              <input type="number" formControlName="propertyAge"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500">
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Area (sqft)</span>
              <input type="number" formControlName="areaSqFt"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500">
              <span *ngIf="isInvalid('areaSqFt')" class="mt-1 block text-sm text-red-600 dark:text-red-400">Area in sqft is required.</span>
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Area (marla)</span>
              <input type="number" formControlName="areaMarla"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500">
            </label>

            <label>
              <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Country</span>
              <input type="text" formControlName="country"
                     class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500">
            </label>
          </div>

          <label class="mt-5 block">
            <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Features</span>
            <textarea formControlName="features" rows="4"
                      class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-950 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-950 dark:text-white dark:focus:border-blue-500"
                      placeholder="Parking, corner plot, servant quarter, basement"></textarea>
          </label>
        </section>
      </main>

      <aside class="space-y-6">
        <section class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
          <h2 class="text-xl font-bold text-gray-950 dark:text-white">Property Images</h2>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">Upload up to 8 images. Each image must be 5MB or smaller.</p>

          <label class="mt-5 flex cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed border-gray-300 bg-gray-50 px-4 py-8 text-center transition hover:border-blue-400 hover:bg-blue-50 dark:border-gray-700 dark:bg-gray-950 dark:hover:border-blue-600 dark:hover:bg-blue-950/30">
            <span class="text-sm font-bold text-gray-800 dark:text-gray-200">Choose images</span>
            <span class="mt-1 text-xs text-gray-500 dark:text-gray-400">JPG, PNG, WebP</span>
            <input type="file" accept="image/*" multiple class="sr-only" (change)="onFilesSelected($event)">
          </label>

          <div *ngIf="imagePreviews.length > 0" class="mt-5 grid grid-cols-2 gap-3">
            <div *ngFor="let preview of imagePreviews; let i = index; trackBy: trackByPreview"
                 class="overflow-hidden rounded-lg border border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-950">
              <img [src]="preview.url" [alt]="preview.name" class="h-24 w-full object-cover">
              <div class="p-3">
                <p class="truncate text-xs font-semibold text-gray-800 dark:text-gray-200">{{ preview.name }}</p>
                <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">{{ formatFileSize(preview.size) }}</p>
                <button type="button" (click)="removeImage(i)" class="mt-2 text-xs font-bold text-red-600 hover:text-red-700 dark:text-red-400">
                  Remove
                </button>
              </div>
            </div>
          </div>
        </section>

        <div *ngIf="error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm font-semibold text-red-700 dark:border-red-900 dark:bg-red-950/40 dark:text-red-300">
          {{ error }}
        </div>

        <button type="submit"
                [disabled]="isSubmitting"
                class="w-full rounded-lg bg-blue-600 px-5 py-4 font-bold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-blue-500 dark:hover:bg-blue-600">
          <span *ngIf="!isSubmitting">Publish Property</span>
          <span *ngIf="isSubmitting">Publishing Property...</span>
        </button>
      </aside>
    </form>
  </div>
</section>
